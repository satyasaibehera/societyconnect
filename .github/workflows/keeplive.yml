name: Project Keep-Alive

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install pg @supabase/supabase-js

      - name: Ping Neon DB & All Supabase Projects
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          
          SUPABASE_URL_SSB: ${{ secrets.SUPABASE_URL_SSB }}
          SUPABASE_URL_CLIENTS: ${{ secrets.SUPABASE_URL_CLIENTS }}
          
          SUPABASE_KEY_SSB: ${{ secrets.SUPABASE_KEY_SSB }}
          SUPABASE_KEY_CLIENTS: ${{ secrets.SUPABASE_KEY_CLIENTS }}
        run: |
          node -e '
          const { Client } = require("pg");
          const { createClient } = require("@supabase/supabase-js");

          async function pingAll() {
            let hasError = false;

            // 1. Ping Neon DB
            if (!process.env.NEON_DATABASE_URL) {
              console.error("❌ Neon DB ping failed: NEON_DATABASE_URL secret is missing!");
              hasError = true;
            } else {
              try {
                const client = new Client({
                  connectionString: process.env.NEON_DATABASE_URL,
                  connectionTimeoutMillis: 10000 // 10s connection timeout guard
                });
                
                await client.connect();
                const res = await client.query("SELECT 1 as ping;");
                await client.end();

                if (res.rows && res.rows.length > 0) {
                  console.log("✅ Neon DB project ping successful!");
                } else {
                  throw new Error("No rows returned from Neon DB");
                }
              } catch (err) {
                console.error("❌ Neon DB ping failed:", err.message);
                hasError = true;
              }
            }

            // 2. Ping Supabase Projects
            const supabaseList = [
              { name: "SSB Project", url: process.env.SUPABASE_URL_SSB, key: process.env.SUPABASE_KEY_SSB },
              { name: "Clients Project", url: process.env.SUPABASE_URL_CLIENTS, key: process.env.SUPABASE_KEY_CLIENTS }
            ];

            for (const item of supabaseList) {
              if (!item.url || !item.key) {
                console.error(`❌ Supabase [${item.name}] failed: Missing URL or Key in secrets!`);
                hasError = true;
                continue;
              }

              try {
                const supabase = createClient(item.url, item.key, {
                  auth: { persistSession: false, autoRefreshToken: false }
                });

                const { data, error } = await supabase.storage.listBuckets();
                
                if (error && error.status !== 401) {
                  console.error(`❌ Supabase [${item.name}] error:`, error.message);
                  hasError = true;
                } else {
                  console.log(`✅ Supabase [${item.name}] ping successful! End-to-end connection verified.`);
                }
              } catch (err) {
                console.error(`❌ Supabase [${item.name}] exception:`, err.message);
                hasError = true;
              }
            }

            if (hasError) process.exit(1);
          }

          pingAll().catch(err => {
            console.error("❌ Unhandled execution error:", err);
            process.exit(1);
          });
          '