name: Project Keep-Alive

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pg client
        run: npm install pg

      - name: Ping Neon DB & All Supabase Projects
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          
          # Supabase URLs
          SUPABASE_URL_SSB: ${{ secrets.SUPABASE_URL_SSB }}
          SUPABASE_URL_CLIENTS: ${{ secrets.SUPABASE_URL_CLIENTS }}
          
          # Supabase Publishable Keys (Safe low-privilege keys for API Gateway pinging)
          SUPABASE_KEY_SSB: ${{ secrets.SUPABASE_KEY_SSB }}
          SUPABASE_KEY_CLIENTS: ${{ secrets.SUPABASE_KEY_CLIENTS }}
        run: |
          node -e '
          const { Client } = require("pg");

          async function pingAll() {
            let hasError = false;

            // 1. Ping Neon DB
            try {
              const client = new Client({ connectionString: process.env.DATABASE_URL });
              await client.connect();
              await client.query("SELECT 1;");
              await client.end();
              console.log("✅ Neon DB project ping successful!");
            } catch (err) {
              console.error("❌ Neon DB ping failed:", err.message);
              hasError = true;
            }

            // 2. Ping Supabase Projects
            const supabaseList = [
              { name: "SSB Project", url: process.env.SUPABASE_URL_SSB, key: process.env.SUPABASE_KEY_SSB },
              { name: "Clients Project", url: process.env.SUPABASE_URL_CLIENTS, key: process.env.SUPABASE_KEY_CLIENTS }
            ];

            for (const item of supabaseList) {
              if (!item.url || !item.key) {
                console.error(`❌ Supabase [${item.name}] failed: Missing URL or Key in secrets!`);
                hasError = true;
                continue;
              }

              try {
                const targetUrl = `${item.url.replace(/\/$/, "")}/rest/v1/`;
                
                // Pass both mandatory apikey AND Authorization headers
                const res = await fetch(targetUrl, {
                  headers: {
                    "apikey": item.key,
                    "Authorization": `Bearer ${item.key}`
                  }
                });
                
                if (res.ok || res.status === 200 || res.status === 204) {
                  console.log(`✅ Supabase [${item.name}] ping successful! (Status: ${res.status})`);
                } else {
                  console.error(`❌ Supabase [${item.name}] ping failed with status: ${res.status}`);
                  hasError = true;
                }
              } catch (err) {
                console.error(`❌ Supabase [${item.name}] ping failed:`, err.message);
                hasError = true;
              }
            }

            if (hasError) process.exit(1);
          }

          pingAll();
          '